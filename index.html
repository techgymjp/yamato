<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>戦艦大和 天一号作戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9e3d2; --dim:#a9a596; --red:#d8432f; --gold:#d6b25a; --cyan:#7fe3ff;
    --panel:rgba(12,16,20,.8); --line:rgba(233,227,210,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#11161a;color:var(--ink);
    font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #game canvas{display:block}
  #overlay{position:fixed;inset:0;pointer-events:none}
  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000;display:none}
  body.playing .hud{display:block}
  #frame{position:fixed;left:0;right:0;top:0;height:7vh;pointer-events:none;display:none;background:linear-gradient(#0b0d0f,rgba(11,13,15,0))}
  body.playing #frame{display:block}
  #tl{left:16px;top:14px;font-size:14px;line-height:1.5}
  #tl .clock{font-size:26px;font-weight:900;letter-spacing:.05em}
  #route{width:240px;height:9px;border:1px solid var(--line);margin:4px 0 2px;position:relative;background:rgba(0,0,0,.35)}
  #routeFill{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
  #tl .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);width:240px}
  #tr{right:16px;top:14px;text-align:right;font-size:14px;line-height:1.5}
  #tr .kills{font-size:40px;font-weight:900;line-height:1}
  #log{left:50%;top:16px;transform:translateX(-50%);width:min(560px,60vw);text-align:center;font-size:15px}
  #log div{transition:opacity 1s;margin:2px 0}
  #log .warn{color:#ffb199} #log .good{color:#bff3c4} #log .hist{color:var(--gold)}
  #alert{left:50%;top:30%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:var(--red);
    letter-spacing:.12em;opacity:0;transition:opacity .25s;white-space:nowrap}
  #bl{left:16px;bottom:14px;width:300px}
  #listTxt{text-align:center;font-size:15px;margin-top:-4px}
  #br{right:16px;bottom:16px;width:270px;text-align:right}
  #beamBox{border:1px solid var(--line);background:rgba(0,0,0,.35);padding:8px 10px}
  #beamBox .lbl{display:flex;justify-content:space-between;font-size:14px}
  .bar{height:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);margin:5px 0;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;display:block;background:linear-gradient(90deg,#2a6cff,#7fe3ff)}
  #beamHint{font-size:13px;color:var(--dim);min-height:1.3em}
  #beamBox.ready{border-color:var(--cyan);box-shadow:0 0 18px rgba(127,227,255,.45)}
  #beamBox.ready #beamHint{color:var(--cyan);font-weight:900;font-size:15px}
  #keys{margin-top:8px;color:var(--dim);font-size:12px;line-height:1.7}
  #radarWrap{left:50%;bottom:12px;transform:translateX(-50%)}
  #lockHint{left:50%;top:58%;transform:translateX(-50%);font-size:15px;color:#fff;background:rgba(0,0,0,.45);padding:6px 14px;border:1px solid var(--line)}
  .key{display:inline-block;border:1px solid var(--line);padding:0 5px;border-radius:3px;font-size:12px;margin:0 2px;background:rgba(255,255,255,.06)}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
  .panel .box{pointer-events:auto;max-width:820px;width:100%;max-height:96vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);padding:22px 28px;backdrop-filter:blur(3px)}
  .title{font-size:clamp(34px,6vw,60px);font-weight:900;letter-spacing:.12em;line-height:1.1;margin:0}
  .title small{display:block;font-size:.4em;letter-spacing:.5em;color:var(--gold);margin-bottom:8px}
  .box p{line-height:1.75;font-size:14.5px;margin:8px 0}
  .box h3{font-size:15px;color:var(--gold);margin:14px 0 6px;letter-spacing:.1em;border-bottom:1px solid var(--line);padding-bottom:3px}
  .rule{font-size:18px;line-height:1.7;margin:12px 0;padding:10px 14px;border-left:4px solid var(--red);background:rgba(255,255,255,.04)}
  .ctl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  button{font-family:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);
    padding:10px 22px;cursor:pointer;letter-spacing:.1em}
  button:hover{background:rgba(255,255,255,.14)}
  button.main{background:#7a1f16;border-color:#c0473a;font-weight:900;font-size:20px;padding:12px 34px}
  button.main:hover{background:#9a2a1e}
  button.sel{outline:2px solid var(--gold)}
  .note{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.7}
  html[lang=en] .title{letter-spacing:.03em;font-size:clamp(28px,4.4vw,44px)}
  html[lang=en] .title small{letter-spacing:.2em}
  html[lang=en] #br{width:300px}
  .langSel{display:flex;gap:8px;margin:10px 0 0}
  .langSel .langBtn{font-size:13px;padding:5px 14px;border-radius:16px;letter-spacing:.05em}
  .langSel .langBtn.on{background:#7a1f16;border-color:#c0473a;font-weight:900}
  .legal{font-size:12px;color:var(--dim);margin:10px 0 0}
  .legal a{color:var(--dim);text-decoration:underline;padding:6px 2px}
  #buildInfo{margin-right:8px;opacity:.8}
  .tc{display:none} body.touch .tc{display:inline} body.touch .kb{display:none}
  .panel .box.small{max-width:520px;text-align:center}
  .panel .box.small .btns{justify-content:center}
  .box .big{font-size:clamp(30px,6vw,54px);font-weight:900;letter-spacing:.15em;margin:0}
  .cont-lead{font-size:15px;line-height:1.7}
  .cont-count{font-size:56px;font-weight:900;color:var(--gold);line-height:1.1}
  .cont-note{min-height:1.4em;color:#ffb199;font-size:13px}
  body.app .share button[data-share]{display:none} body.app .share #appShare{display:inline-block!important}
  @media (max-height:500px){
    .panel .box{padding:12px 18px}
    .title{font-size:30px} .box p{font-size:13px;line-height:1.55;margin:4px 0}
    .rule{font-size:14px;margin:6px 0;padding:6px 10px} .ctl{font-size:12.5px} .box h3{margin:8px 0 4px}
    #result .big{font-size:28px!important} #result .sub{margin:2px 0!important;font-size:12px!important} #result .stats{margin:6px 0!important;gap:5px!important} #result .stats div{padding:3px 8px!important;font-size:11.5px!important} #result .stats b{font-size:16px!important}
    .hist{font-size:12.5px!important;line-height:1.6!important} .btns{margin-top:10px} button.main{padding:8px 24px;font-size:17px}
    .cont-count{font-size:40px}
    #title .title{font-size:26px!important} #title .title br{display:none} #title .title small{display:inline;margin-right:10px;font-size:13px;letter-spacing:.3em}
    #title .box > p:first-of-type, #title .note{display:none}
    #result .box{display:flex;flex-direction:column}
    #result .btns{order:3;margin-top:4px} #result .share{order:4;margin-top:8px;padding-top:8px} #result .hist{order:5;margin-top:10px}
    #result .stats{grid-template-columns:repeat(4,1fr)!important}
  }
  #result .big{font-size:clamp(36px,7vw,68px);font-weight:900;letter-spacing:.15em;margin:0}
  #result .sub{color:var(--dim);font-size:14px;margin:6px 0}
  #result .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
  #result .stats div{border:1px solid var(--line);padding:8px 10px;font-size:13px}
  #result .stats b{display:block;font-size:24px}
  .hist{border-left:3px solid var(--gold);padding-left:12px;color:#ddd5bf}
  .share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .share span{font-size:13px;color:var(--dim);margin-right:4px}
  .share button{font-size:14px;padding:8px 14px}
  .share button[data-share="x"]{background:#111;border-color:#555}
  .share button[data-share="line"]{background:#06a046;border-color:#2fc26a}
  .share button[data-share="fb"]{background:#1d5bbf;border-color:#4b82e0}

  #touch{position:fixed;left:0;right:0;bottom:190px;display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
  #touch .grp{display:flex;gap:8px;pointer-events:auto}
  #touch button{padding:16px 16px;font-size:15px;background:rgba(0,0,0,.45);touch-action:none}
  /* スマホ：ゲージは上、ボタンは下端の左右に分けて重ならないように */
  body.touch #keys, body.touch #lockHint{display:none!important}
  body.playing.touch #touch{display:block;inset:0;bottom:0;padding:0}
  body.touch #touch .grp{position:absolute;bottom:10px;gap:8px}
  body.touch #touch .left{left:10px;flex-direction:row}
  body.touch #touch .right{right:10px;flex-direction:column-reverse;align-items:flex-end}
  body.touch #touch button{padding:12px 16px;font-size:15px}
  body.touch #touch .fireBtn{width:88px;height:88px;border-radius:50%;padding:0;font-weight:900;background:rgba(122,31,22,.6);border-color:#c0473a}
  body.touch #touch button[data-k="auto"]{font-size:12px;padding:8px 10px}
  body.touch #tl{font-size:12px;line-height:1.35} body.touch #tl .clock{font-size:20px}
  body.touch #route, body.touch #tl .ends{width:150px}
  body.touch #bl{top:112px;bottom:auto;left:6px;transform:scale(.52);transform-origin:left top}
  body.touch #tr{font-size:12px} body.touch #tr .kills{font-size:26px}
  body.touch #br{top:96px;bottom:auto;right:8px;width:175px}
  body.touch #beamBox{padding:5px 8px} body.touch #beamBox .lbl{font-size:12px} body.touch #beamHint{font-size:11px}
  body.touch #beamBox.ready #beamHint{font-size:12px}
  body.touch #radarWrap{display:block!important;bottom:6px;transform:translateX(-50%) scale(.55);transform-origin:center bottom}
  body.touch #log{top:auto;bottom:108px;width:min(480px,60vw);font-size:13px}
  body.touch #alert{font-size:26px}
  @media (orientation:portrait){
    body.touch #radarWrap{left:6px;bottom:70px;transform:scale(.55);transform-origin:left bottom}
    body.touch #log{bottom:auto;top:230px;width:90vw}
  }
  @media (max-width:720px){
    #bl{width:210px} #br{width:180px} #tr{font-size:12px} #tr .kills{font-size:28px}
    #tl .clock{font-size:20px} #route,#tl .ends{width:160px}
    #keys{display:none} #log{top:96px;width:90vw}
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="frame"></div>
<canvas id="overlay"></canvas>

<div id="tl" class="hud">
  <div class="clock" id="clock">12:20</div>
  <div id="dateTxt" data-i18n="hud.date">昭和20年4月7日　曇・低雲</div>
  <div><span data-i18n="hud.toOkinawa">沖縄まで</span> <b id="distTxt">240</b> <span data-i18n="hud.nm">浬</span></div>
  <div id="route"><div id="routeFill"></div></div>
  <div class="ends"><span data-i18n="hud.from">坊ノ岬沖</span><span data-i18n="hud.to">沖縄</span></div>
</div>
<div id="tr" class="hud">
  <div data-i18n="hud.kills">敵機撃墜</div>
  <div class="kills" id="killTxt">0</div>
  <div><span data-i18n="hud.carriers">敵空母撃沈</span> <b id="carTxt">0</b> / 6</div>
  <div><span data-i18n="hud.torp">被雷</span> <span id="torpTxt">0</span>　<span data-i18n="hud.crash">体当たり</span> <span id="crashTxt">0</span>　<span data-i18n="hud.bomb">被弾</span> <span id="bombTxt">0</span></div>
</div>
<div id="log" class="hud"></div>
<div id="alert" class="hud"></div>
<div id="lockHint" class="hud" data-i18n="hud.lockHint">クリックで照準開始（マウスで自由に見回せます）</div>
<div id="bl" class="hud">
  <canvas id="incl" width="300" height="150"></canvas>
  <div id="listTxt">横転まで あと 30°</div>
</div>
<div id="br" class="hud">
  <div id="beamBox">
    <div class="lbl"><span data-i18n="hud.railgun">レールガン</span><span id="enTxt">0%</span></div>
    <div class="bar"><i id="enBar"></i></div>
    <div id="beamHint" data-i18n="hud.charging">充電中…</div>
  </div>
  <div id="keys" data-i18n-html="hud.keys"></div>
</div>
<div id="radarWrap" class="hud"><canvas id="radar" width="170" height="170"></canvas></div>

<div id="touch">
  <div class="grp left"><button data-k="left" data-i18n="btn.left">◀ 取舵</button><button data-k="right" data-i18n="btn.right">面舵 ▶</button></div>
  <div class="grp right"><button data-k="fire" class="fireBtn" data-i18n="btn.fire">ミサイル</button><button data-k="beam" data-i18n="btn.beam">レールガン</button><button data-k="auto" id="autoBtn" data-i18n="btn.autoOff">自動射撃 OFF</button></div>
</div>

<div id="title" class="panel">
  <div class="box">
    <h1 class="title"><small data-i18n="title.date">昭和二十年四月七日</small><span data-i18n-html="title.name">戦艦大和<br>天一号作戦</span></h1>
    <p class="lead" data-i18n-html="title.lead"></p>
    <div class="rule" data-i18n-html="title.rule"></div>
    <h3 data-i18n="title.controls">操作</h3>
    <div class="ctl">
      <span class="kb" data-i18n="ctl.mouse"></span><span class="kb" data-i18n="ctl.mouseD"></span>
      <span class="kb" data-i18n="ctl.click"></span><span class="kb" data-i18n="ctl.clickD"></span>
      <span class="kb"><span data-i18n="ctl.rclick"></span><span class="key">Space</span></span><span class="kb" data-i18n="ctl.rclickD"></span>
      <span class="kb"><span class="key">A</span><span class="key">D</span></span><span class="kb" data-i18n-html="ctl.rudderD"></span>
      <span class="kb"><span class="key">M</span></span><span class="kb" data-i18n="ctl.bgm"></span>
      <span class="tc" data-i18n="ctl.drag"></span><span class="tc" data-i18n="ctl.dragD"></span>
      <span class="tc" data-i18n="ctl.fireT"></span><span class="tc" data-i18n="ctl.fireTD"></span>
      <span class="tc" data-i18n="ctl.beamT"></span><span class="tc" data-i18n="ctl.beamTD"></span>
      <span class="tc" data-i18n="ctl.rudderT"></span><span class="tc" data-i18n-html="ctl.rudderD"></span>
    </div>
    <div class="btns">
      <span style="font-size:14px;color:var(--dim)" data-i18n="diff.label">難易度</span>
      <button data-diff="0.7" data-i18n="diff.easy">易</button><button data-diff="1" class="sel" data-i18n="diff.normal">普通</button><button data-diff="1.4" data-i18n="diff.hist">史実</button>
      <span style="flex:1"></span>
      <button class="main" id="startBtn" data-i18n="title.start">出撃</button>
    </div>
    <div class="note" data-i18n="title.note"></div>
    <p class="legal">
      <span id="buildInfo"></span>
      <a href="https://techgym.jp/privacy-policy/" data-i18n-href="url.privacy" target="_blank" rel="noopener" data-i18n="legal.privacy">プライバシーポリシー</a>
      <span id="adPrivacy" style="display:none">｜<a href="#" id="adPrivacyLink" data-i18n="legal.adSettings">広告の設定</a></span>
      <span>｜© TECH GYM</span>
    </p>
    <p class="langSel"><button class="langBtn" data-lang="ja">日本語</button><button class="langBtn" data-lang="en">English</button></p>
  </div>
</div>

<div id="pause" class="panel" style="display:none">
  <div class="box small">
    <p class="big" data-i18n="pause.title">一時停止</p>
    <div class="btns"><button class="main" id="resumeBtn" data-i18n="pause.resume">戦闘再開</button><button id="quitBtn" data-i18n="pause.quit">タイトルへ</button></div>
  </div>
</div>

<div id="continue" class="panel" style="display:none">
  <div class="box small">
    <p class="big" style="color:#ff8b78" data-i18n="cont.title">傾斜 30°</p>
    <p class="cont-lead" data-i18n-html="cont.lead"></p>
    <div class="cont-count" id="contCount">10</div>
    <p class="cont-note" id="contNote"></p>
    <div class="btns"><button class="main" id="contWatch">▶ 広告を見て応急修理</button><button id="contGiveUp" data-i18n="cont.giveUp">あきらめる</button></div>
  </div>
</div>

<div id="result" class="panel" style="display:none">
  <div class="box">
    <p class="big" id="resTitle">大和 沈没</p>
    <div class="sub" id="resSub"></div>
    <div class="stats" id="resStats"></div>
    <p class="hist" id="resHist"></p>
    <div class="btns"><button class="main" id="againBtn" data-i18n="res.again">再び出撃</button><button id="viewBtn" data-i18n="res.view">艦影を眺める</button></div>
    <div class="share">
      <span data-i18n="share.label">結果をシェア</span>
      <button data-share="x">X（Twitter）</button><button data-share="line">LINE</button><button data-share="fb">Facebook</button>
      <button data-share="copy" data-i18n="share.copy">リンクをコピー</button><button data-share="native" id="nativeShare" style="display:none" data-i18n="share.more">その他…</button>
      <button data-share="app" id="appShare" style="display:none" data-i18n="share.app">シェアする</button>
    </div>
  </div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/build-info.js"></script>
<script src="js/ads-config.js"></script>
<script src="js/ads.js"></script>
<script>
'use strict';
// Android アプリ（Capacitor）で動いているか。Web 版では Capacitor がないので何もしない
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const t = I18N.t;
const plugin = name => (NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins[name] : null);
// 広告の表示中などに音を止める（js/ads.js から呼ぶ）
const GameAudio = {
  suspend() { try { if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); } catch (e) { /* 無視 */ } },
  resume() { try { if (AU.ctx && AU.ctx.state === 'suspended' && !document.hidden) AU.ctx.resume(); } catch (e) { /* 無視 */ } },
};
// ============================================================
//  共通ユーティリティ
// ============================================================
const DEG = Math.PI / 180;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
function angWrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const tmpV = V3(), tmpV2 = V3();

// ============================================================
//  レンダラー・シーン
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth, innerHeight);
$('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_DAY = new THREE.Color(0x8b949c), FOG_NIGHT = new THREE.Color(0x141c26);
const fogColor = FOG_DAY.clone();
const FOG_NEAR = 250, FOG_FAR = 8200;
scene.fog = new THREE.Fog(fogColor, FOG_NEAR, FOG_FAR);
scene.background = fogColor;

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 22000);
const hemi = new THREE.HemisphereLight(0xc8d0d8, 0x2a3540, 0.9);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff2e0, 0.7);
sunLight.position.set(-0.4, 1, 0.3);
sunLight.castShadow = true;
Object.assign(sunLight.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 10, far: 1400 });
sunLight.shadow.mapSize.set(2048, 2048); sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.3;
scene.add(sunLight, sunLight.target);

// 空（曇天のグラデーション）
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTop: { value: new THREE.Color(0x5a636b) }, uHor: { value: fogColor } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `uniform vec3 uTop; uniform vec3 uHor; varying vec3 vP;

class Particles {
  constructor(n, additive) {
    this.n = n; this.i = 0;
    const F = k => new Float32Array(n * k);
    this.pos = F(3); this.vel = F(3); this.col = F(3); this.alpha = F(1); this.size = F(1);
    this.life = F(1); this.max = F(1); this.s0 = F(1); this.s1 = F(1); this.a0 = F(1); this.grav = F(1); this.drag = F(1);
    const g = new THREE.BufferGeometry();
    this.aPos = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage);
    this.aAlpha = new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.aPos); g.setAttribute('pcolor', this.aCol);
    g.setAttribute('alpha', this.aAlpha); g.setAttribute('psize', this.aSize);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: innerHeight * 0.85 }, uFogColor: { value: fogColor }, uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR }, uAdd: { value: additive ? 1 : 0 } },
      vertexShader: `attribute float alpha; attribute float psize; attribute vec3 pcolor; uniform float uScale; uniform float uFogNear; uniform float uFogFar;
        varying float vA; varying vec3 vC; varying float vFog;
        void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); gl_Position = projectionMatrix*mv;
          gl_PointSize = psize*uScale/max(-mv.z,1.0); vA = alpha; vC = pcolor; vFog = smoothstep(uFogNear,uFogFar,-mv.z); }`,
      fragmentShader: `uniform vec3 uFogColor; uniform float uAdd; varying float vA; varying vec3 vC; varying float vFog;
        void main(){ vec2 c = gl_PointCoord-0.5; float d = length(c); if(d>0.5) discard;
          float s = smoothstep(0.5,0.05,d); vec3 col = mix(vC, uFogColor, vFog*(1.0-uAdd));
          gl_FragColor = vec4(col, vA*s*(1.0 - vFog*uAdd)); }`,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
    });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false; this.points.renderOrder = 3;
    scene.add(this.points);
  }
  spawn(x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a, grav = 0, drag = 0) {
    const i = this.i; this.i = (i + 1) % this.n; const i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.col[i3] = r; this.col[i3 + 1] = g; this.col[i3 + 2] = b;
    this.life[i] = life; this.max[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.a0[i] = a; this.grav[i] = grav; this.drag[i] = drag;
  }
  update(dt) {
    const { pos, vel, life } = this;
    for (let i = 0; i < this.n; i++) {
      if (life[i] <= 0) { this.alpha[i] = 0; this.size[i] = 0; continue; }
      life[i] -= dt;
      const t = 1 - life[i] / this.max[i], i3 = i * 3, dr = Math.max(0, 1 - this.drag[i] * dt);
      vel[i3] *= dr; vel[i3 + 1] = vel[i3 + 1] * dr - this.grav[i] * dt; vel[i3 + 2] *= dr;
      pos[i3] += vel[i3] * dt; pos[i3 + 1] += vel[i3 + 1] * dt; pos[i3 + 2] += vel[i3 + 2] * dt;
      this.size[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * t;
      this.alpha[i] = this.a0[i] * (1 - t) * Math.min(1, t * 12 + 0.15);
    }
    this.aPos.needsUpdate = this.aCol.needsUpdate = this.aAlpha.needsUpdate = this.aSize.needsUpdate = true;
  }
}

function hullWidth(t) {

function makeHull(L, B, freeboard, draft, sheer, topCol, botCol, mat) {
  const shape = new THREE.Shape(), N = 48;
  shape.moveTo(0, L / 2);
  for (let i = 1; i <= N; i++) { const t = i / N; shape.lineTo(B / 2 * hullWidth(t), -(-L / 2 + t * L)); }
  for (let i = N; i >= 1; i--) { const t = i / N; shape.lineTo(-B / 2 * hullWidth(t), -(-L / 2 + t * L)); }
  const depth = freeboard + draft;
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, steps: Math.round(depth / 1.5) });
  geo.rotateX(-Math.PI / 2); geo.translate(0, -draft, 0);

  const p = geo.attributes.position, cols = [];

  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y > freeboard - 0.2) y += sh(z);
    if (y < -draft + 0.2) x *= 0.72;
    p.setXYZ(i, x, y, z);

  }

  for (let i = 0; i < dp.count; i++) dp.setY(i, freeboard + sh(dp.getZ(i)) + 0.06);

}

  for (let i = 1; i < P.length; i++) if (t <= P[i][0]) { const [t0, h0] = P[i - 1], [t1, h1] = P[i], u = (t - t0) / (t1 - t0); return h0 + (h1 - h0) * u * u * (3 - 2 * u); }
  return 8.9;
}
function yDeckAt(lz) { return yDeckH(clamp((lz + Y_LEN / 2) / Y_LEN, 0, 1)); }

function makeYamatoHull() {
  const L = Y_LEN, NS = 120, NR = 16, draft = 10.4;
  const pos = [], uv = [], idx = [], dpos = [], duv = [], didx = [];
  for (let side = 0; side < 2; side++) {
    const sg = side ? -1 : 1, base = pos.length / 3;
    for (let i = 0; i <= NS; i++) {
      const t = Math.pow(i / NS, 1.0), zc = -L / 2 + t * L;
      const hw = Math.max(0, yamatoW(t)), wl = hw * (t < 0.3 ? lerp(0.78, 0.97, t / 0.3) : 0.98);
      const dH = yDeckH(t);
      const keel = t < 0.05 ? lerp(1.5, draft, Math.pow(t / 0.05, 0.6)) : (t > 0.9 ? lerp(draft, 3, (t - 0.9) / 0.1) : draft);
      const rake = Math.max(0, 1 - t / 0.075);
      for (let j = 0; j <= NR; j++) {
        const s = j / NR; let x, y;
        if (s < 0.55) { const a = s / 0.55 * Math.PI / 2; x = wl * Math.pow(Math.sin(a), 0.45); y = -keel * Math.pow(Math.cos(a), 0.45); }
        else { const u = (s - 0.55) / 0.45; y = u * dH; x = wl + (hw - wl) * Math.pow(u, 1.4); }
        const z = zc + (1 - (y + keel) / (dH + keel)) * 11 * rake;
        pos.push(sg * x, y, z); uv.push(t, (y + 11) / 25);
      }
    }
    for (let i = 0; i < NS; i++) for (let j = 0; j < NR; j++) {
      const a = base + i * (NR + 1) + j, b = a + NR + 1, c = a + 1, d = b + 1;
      if (sg > 0) idx.push(a, c, b, c, d, b); else idx.push(a, b, c, c, b, d);
    }
  }
  for (let i = 0; i <= NS; i++) {
    const t = i / NS, z = -L / 2 + t * L, hw = Math.max(0, yamatoW(t)), y = yDeckH(t) + 0.02;
    dpos.push(-hw, y, z, hw, y, z); duv.push(-hw / 4, z / 9, hw / 4, z / 9);
    if (i < NS) { const p = i * 2; didx.push(p, p + 2, p + 1, p + 1, p + 2, p + 3); }

  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dpos, 3)); dg.setAttribute('uv', new THREE.Float32BufferAttribute(duv, 2));
  dg.setIndex(didx); dg.computeVertexNormals();
  const g = new THREE.Group();
  g.add(new THREE.Mesh(hg, YM.hull), new THREE.Mesh(dg, YM.deck));
  // 舷側の縁（ブルワーク風の細い帯）
  return g;
}

function fireBeam(aim) {

let aaTimer = 0;
function updatePlay(dt) {
  G.elapsed += dt;
  G.clock = 12 * 60 + 20 + G.elapsed * MIN_PER_SEC;
  G.dist = TOTAL_NM * (1 - progress());
  for (const h of HIST) if (!G.histDone[h.t] && G.clock >= h.t) { G.histDone[h.t] = 1; h.f(); }
  setDaylight(clamp(1 - (G.clock - (17 * 60 + 30)) / 100, 0.55, 1));

  // 操艦（旋回は素早く）
  let rud = 0;
  if (keys.KeyA || keys.ArrowLeft || touchHold.left) rud += 1;
  if (keys.KeyD || keys.ArrowRight || touchHold.right) rud -= 1;
  G.turnRate = lerp(G.turnRate, rud * 7 * DEG, Math.min(1, dt * 1.8));
  G.heading = angWrap(G.heading + G.turnRate * dt);
  const f = fwdV();
  G.vel.set(f.x, 0, f.z).multiplyScalar(G.speed * 0.5144 * 1.6);
  G.pos.addScaledVector(G.vel, dt);

  // 傾斜（応急修理でゆっくり戻る）
  // 応急修理：被弾後10秒は回復せず、その後もごくわずか
  if (G.elapsed - G.lastHit > 10) G.listT += (G.listT > 0 ? -0.05 : 0.05) * dt;
  G.list = lerp(G.list, G.listT, Math.min(1, dt * 0.6));
  G.maxList = Math.max(G.maxList, G.list);
  if (G.list >= MAX_LIST) return canContinue() ? showContinue() : endGame('capsize');
  if (G.elapsed >= DURATION) return endGame('win');

  // 敵機の来襲（途切れなく、時間とともに激化）
  if (G.clock >= 12 * 60 + 30) {
    G.spawnT -= dt;
    if (G.spawnT <= 0 && planes.length < maxPlanes()) {
      spawnGroup();
      G.spawnT = lerp(2.0, 0.6, progress()) / diff / (1 - 0.08 * G.csunk);
    }
  }
  G.mgActive = 0;
  updatePlanes(dt);
  updateOrdnance(dt);

  // 自動対空砲火（演出）
  aaTimer -= dt;
  const alive = planes.filter(p => p.state !== 'falling');
  while (aaTimer <= 0 && alive.length) {
    aaTimer += 0.035;
    const pl = alive[Math.floor(Math.random() * alive.length)];
    const d = pl.pos.distanceTo(G.pos);
    if (d > 2800) continue;
    if (Math.random() < 0.4) flak(V3(pl.pos.x + rand(-70, 70), pl.pos.y + rand(-40, 40), pl.pos.z + rand(-70, 70)));
    const src = ship.localToWorld(V3(rand(-14, 14), Y_FB + 11, rand(-30, 25)));
    const v = pl.pos.clone().add(V3(rand(-50, 50), rand(-30, 30), rand(-50, 50))).sub(src).normalize().multiplyScalar(700);
    PA.spawn(src.x, src.y, src.z, v.x, v.y, v.z, Math.min(3, d / 700), 2.2, 2.2, 1, 0.75, 0.3, 1);
  }
  for (const pl of alive) if (pl.pos.distanceTo(G.pos) < 1600 && Math.random() < 0.01 * dt) killPlane(pl, true);

  // ミサイル連射
  G.fireCool -= dt;
  if ((mouse.down || touchHold.fire || autoFire) && G.fireCool <= 0) { G.fireCool = 0.075; fireMissile(aimDir()); }
  G.energy = Math.min(100, G.energy + dt * 100 / 22);

  updateShipTransform(dt);
  updateEscorts(dt);
  updateCarriers(dt);
  updateIsland();
  shipEffects(dt);

  // 視点（ロックしていない時は画面端で見回し）
  if (!locked() && !document.body.classList.contains('touch')) {
    if (Math.abs(mouse.x) > 0.85) G.yaw = clamp(G.yaw - Math.sign(mouse.x) * (Math.abs(mouse.x) - 0.85) * 10 * dt, -175 * DEG, 175 * DEG);
    if (Math.abs(mouse.y) > 0.85) G.pitch = clamp(G.pitch + Math.sign(mouse.y) * (Math.abs(mouse.y) - 0.85) * 6 * dt, -0.5, 1.35);
  }
  head.rotation.y = G.yaw;
  camera.rotation.set(G.pitch + (Math.random() - 0.5) * G.shake * 0.02, (Math.random() - 0.5) * G.shake * 0.02, 0);
  G.shake = Math.max(0, G.shake - dt * 1.6);
  G.flash = Math.max(0, G.flash - dt * 0.9);
  G.alertT -= dt; if (G.alertT <= 0) $('alert').style.opacity = 0;
  G.pingT -= dt;

  if (AU.ctx) {
    let nd = 1e9; for (const pl of alive) nd = Math.min(nd, pl.pos.distanceTo(G.pos));
    AU.droneGain.gain.value = lerp(AU.droneGain.gain.value, clamp(1 - nd / 2500, 0, 1) * 0.06, dt * 2);
    G.mgSnd -= dt;
    if (G.mgActive > 0 && G.mgSnd <= 0) { G.mgSnd = 0.07; AU.mg(G.mgActive); }
  }
  updateHUD();
}

  for (const t of torps) {
    const s = project(t.pos); if (!s) continue;
    x.fillStyle = '#ff5a48'; x.beginPath(); x.moveTo(s[0], s[1] - 6); x.lineTo(s[0] - 6, s[1] - 16); x.lineTo(s[0] + 6, s[1] - 16); x.fill();
  }
  for (const c of carriers) {
    if (!c.alive) continue;
    const s = project(tmpV2.copy(c.pos).setY(40)); if (!s) continue;
    x.strokeStyle = '#ff6a55'; x.fillStyle = '#ff6a55'; x.strokeRect(s[0] - 26, s[1] - 10, 52, 20);
    x.font = '11px serif'; x.fillText(t('hud.carrierTag', { name: t('name.' + c.name) }), s[0], s[1] - 15); x.font = 'bold 12px serif';
  }
  // 照準
  const centered = locked() || document.body.classList.contains('touch');
  const mx = centered ? innerWidth / 2 : mouse.sx, my = centered ? innerHeight / 2 : mouse.sy;
  const ready = G.energy >= 100;
  x.strokeStyle = ready ? 'rgba(127,227,255,.95)' : 'rgba(255,240,200,.95)'; x.lineWidth = 2;
  x.beginPath(); x.arc(mx, my, 14, 0, Math.PI * 2); x.moveTo(mx - 24, my); x.lineTo(mx - 7, my); x.moveTo(mx + 7, my); x.lineTo(mx + 24, my);
  x.moveTo(mx, my - 24); x.lineTo(mx, my - 7); x.moveTo(mx, my + 7); x.lineTo(mx, my + 24); x.stroke();
  if (ready) { x.beginPath(); x.arc(mx, my, 22 + Math.sin(T * 8) * 3, 0, Math.PI * 2); x.stroke(); }
  // 傾斜の危険表示
  if (G.list > 18) {
    const a = (G.list - 18) / 12 * (0.5 + 0.5 * Math.sin(T * 8));
    const gr = x.createLinearGradient(0, 0, innerWidth * 0.35, 0);
    gr.addColorStop(0, `rgba(200,20,10,${0.6 * a})`); gr.addColorStop(1, 'rgba(200,20,10,0)');
    x.fillStyle = gr; x.fillRect(0, 0, innerWidth * 0.35, innerHeight);
  }
}

// ============================================================
//  エンディング（艦の全体が見渡せる視点）
// ============================================================
let endT = 0, orbitA = 0, endExploded = false, viewOnly = false;
function endGame(cause) {
  state = 'ending'; endT = 0; endExploded = false; viewOnly = false;
  G.endCause = cause; G.endClock = G.clock;
  if (locked()) document.exitPointerLock();
  document.body.classList.remove('playing');
  $('alert').style.opacity = 0;
  head.remove(camera); scene.add(camera);
  orbitA = G.heading + Math.PI * 0.75;
  if (cause !== 'win') { AU.alarm(); BGM.fade(0.12, 2); } else BGM.fade(0.45, 1);
  if (AU.ctx) AU.droneGain.gain.value = 0;
  for (const pl of planes) if (pl.state !== 'falling') pl.state = 'egress';
  mouse.down = false; for (const k in touchHold) touchHold[k] = false;
}
function updateEnding(dt) {
  endT += dt;
  const win = G.endCause === 'win';
  if (win) {
    G.speed = lerp(G.speed, 6, dt * 0.2);
    G.vel.copy(fwdV()).multiplyScalar(G.speed * 0.8);
    G.pos.addScaledVector(G.vel, dt);
    G.list = lerp(G.list, 0, dt * 0.2); G.turnRate = lerp(G.turnRate, 0, dt);
    updateShipTransform(dt); updateIsland(); shipEffects(dt);
  } else {
    // 左舷へ横転→沈没→弾火薬庫誘爆
    const roll = Math.min(125, G.list + endT * endT * 1.6);
    G.speed = lerp(G.speed, 0, dt * 0.3);
    G.pos.addScaledVector(fwdV(), G.speed * 0.5 * dt);
    ship.position.set(G.pos.x, -Math.pow(Math.max(0, endT - 4), 2) * 0.35, G.pos.z);
    ship.rotation.y = G.heading; ship.rotation.x = Math.min(0.15, endT * 0.01); ship.rotation.z = roll * DEG;
    if (endT < 9) for (let i = 0; i < 3; i++) { const p = ship.localToWorld(V3(rand(-15, 15), rand(0, 20), rand(-120, 120))); PN.spawn(p.x, Math.max(1, p.y), p.z, 0, 6, 0, 6, 10, 40, 0.1, 0.1, 0.1, 0.7, -0.4, 0.3); }
    if (endT > 8.5 && !endExploded) {
      endExploded = true;
      const p = V3(G.pos.x, 10, G.pos.z);
      for (let i = 0; i < 500; i++) PA.spawn(p.x + rand(-30, 30), p.y + rand(0, 40), p.z + rand(-30, 30), rand(-25, 25), rand(40, 220), rand(-25, 25), rand(1.5, 4), 30, 90, 1, rand(0.4, 0.75), 0.15, 0.9, 25, 0.4);
      for (let i = 0; i < 450; i++) PN.spawn(p.x + rand(-40, 40), p.y + rand(0, 60), p.z + rand(-40, 40), rand(-20, 20), rand(30, 160), rand(-20, 20), rand(12, 22), 40, 260, 0.1, 0.09, 0.08, 0.85, 4, 0.25);
      splash(p, 6); G.flash = 1; AU.boom(0, 3);
    }
    for (const e of emitters) { const p = ship.localToWorld(V3(e.lx, e.ly, e.lz)); if (p.y > 0) PN.spawn(p.x, p.y, p.z, 0, 7, 0, 5, 6, 30, 0.08, 0.08, 0.08, 0.7, -0.5, 0.3); }
    updateEscorts(dt);
  }
  updateCarriers(dt); updatePlanes(dt); updateOrdnance(dt);
  orbitA += dt * (win ? 0.12 : 0.08);
  const R = win ? 320 : 360 + endT * 9, H = win ? 55 : 70 + endT * 5;
  camera.position.set(G.pos.x + Math.cos(orbitA) * R, H, G.pos.z + Math.sin(orbitA) * R);
  camera.lookAt(G.pos.x, win ? 20 : 10, G.pos.z);
  G.flash = Math.max(0, G.flash - dt * 0.5);
  if (endT > (win ? 4 : 13) && !$('result').dataset.shown && !viewOnly) showResult();
}
function showResult() {
  const r = $('result'); r.dataset.shown = '1'; r.style.display = 'flex';
  const win = G.endCause === 'win', c = fmtClock(G.endClock);
  $('resTitle').textContent = t(win ? 'res.win' : 'res.sunk');
  $('resTitle').style.color = win ? '#e9d48a' : '#e9e3d2';
  $('resSub').textContent = `${t('res.subDate', { d: 7 + c.d, time: c.s })}　${t(win ? 'res.subWin' : 'res.subSunk')}`;
  const m = Math.floor(G.elapsed / 60), s = Math.floor(G.elapsed % 60);
  const st = [['st.kills', G.kills + G.aaKills], ['st.carriers', `${G.csunk} / 6`], ['st.torp', t('st.torpV', { n: G.torpHits })], ['st.crash', t('st.crashV', { n: G.crashHits })],
    ['st.dodged', t('st.dodgedV', { n: G.dodged })], ['st.bomb', t('st.bombV', { n: G.bombHits })],
    ['st.time', t('st.timeV', { m, s: String(s).padStart(2, '0') })], ['st.dist', t('st.distV', { n: G.dist.toFixed(1) })]].map(([k, v]) => [t(k), v]);
  $('resStats').innerHTML = st.map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
  $('resHist').textContent = t(win ? 'res.histWin' : 'res.histSunk');
}

// ============================================================
//  タイトル・開始
// ============================================================
let titleA = 0;
function updateTitle(dt) {
  if (!G) newGame();
  titleA += dt * 0.07;
  G.pos.addScaledVector(G.vel.set(0, 0, -12), dt);
  updateShipTransform(dt); updateEscorts(dt); updateCarriers(dt); shipEffects(dt);
  camera.position.set(G.pos.x + Math.cos(titleA) * 290, 38, G.pos.z + Math.sin(titleA) * 290);
  camera.lookAt(G.pos.x, 20, G.pos.z);
}
document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => {
  diff = +b.dataset.diff; document.querySelectorAll('[data-diff]').forEach(x => x.classList.toggle('sel', x === b));
}));
function startGame() {
  AU.init(); BGM.start(); BGM.fade(0.33, 0.5);
  newGame();
  $('title').style.display = 'none'; $('result').style.display = 'none'; delete $('result').dataset.shown;
  if (camera.parent !== head) { if (camera.parent) camera.parent.remove(camera); head.add(camera); }
  camera.position.set(0, 0, 0); camera.rotation.set(G.pitch, 0, 0);
  G.yaw = 35 * DEG;   // 左舷寄りを向いて開始
  state = 'play'; document.body.classList.add('playing');
  setDaylight(1);
  msg(t('msg.start'), 'hist');
}
// ------------------------------------------------------------
//  結果のシェア
// ------------------------------------------------------------
const SHARE_URL = 'https://techgym.jp/column/claude-code-game-yamato/';
function shareText() {
  const kills = G.kills + G.aaKills;
  const head = G.endCause === 'win' ? t('share.win') : t('share.sunk', { n: G.dist.toFixed(0) });
  return `${head}\n${t('share.stats', { k: kills, c: G.csunk, t: G.torpHits, d: G.dodged })}\n${t('share.tag')}`;
}
if (navigator.share && !NATIVE) $('nativeShare').style.display = '';
document.querySelectorAll('[data-share]').forEach(b => b.addEventListener('click', async () => {
  const text = shareText(), u = encodeURIComponent(SHARE_URL), t = encodeURIComponent(text);
  const kind = b.dataset.share;
  if (kind === 'x') window.open(`https://twitter.com/intent/tweet?text=${t}&url=${u}`, '_blank', 'noopener');
  else if (kind === 'line') window.open(`https://social-plugins.line.me/lineit/share?url=${u}&text=${t}`, '_blank', 'noopener');
  else if (kind === 'fb') window.open(`https://www.facebook.com/sharer/sharer.php?u=${u}`, '_blank', 'noopener');
  else if (kind === 'app') {
    const sh = plugin('Share');
    if (sh) { try { await sh.share({ title: t('share.title'), text, url: SHARE_URL, dialogTitle: t('share.dialog') }); } catch (e) { /* キャンセル */ } }
  }
  else if (kind === 'native') { try { await navigator.share({ title: t('share.title'), text, url: SHARE_URL }); } catch (e) { /* キャンセル */ } }
  else {
    try { await navigator.clipboard.writeText(`${text}\n${SHARE_URL}`); b.textContent = t('share.copied'); }
    catch (e) { prompt(t('share.prompt'), SHARE_URL); }
    setTimeout(() => { b.textContent = t('share.copy'); }, 2000);
  }
}));
$('startBtn').addEventListener('click', startGame);
// 2 回に 1 回、「再び出撃」の前に全画面広告を出す（Android アプリのみ）
let retryBusy = false, gameOvers = 0;
$('againBtn').addEventListener('click', async () => {
  if (retryBusy) return;
  AU.init();
  gameOvers++;
  if (Ads.available && gameOvers % 2 === 0) { retryBusy = true; await Ads.showInterstitial(); retryBusy = false; }
  startGame();
});

// ------------------------------------------------------------
//  一時停止（戻るボタン・アプリの切り替え）
// ------------------------------------------------------------
function setPaused(on) {
  if (state !== 'play' || !G) return;
  G.paused = on;
  $('pause').style.display = on ? 'flex' : 'none';
  document.body.classList.toggle('playing', !on);
  if (on) { mouse.down = false; for (const k in touchHold) touchHold[k] = false; if (locked()) document.exitPointerLock(); if (AU.ctx) AU.droneGain.gain.value = 0; }
}
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('quitBtn').addEventListener('click', () => { setPaused(false); toTitle(); });
function toTitle() {
  state = 'title'; document.body.classList.remove('playing');
  $('result').style.display = 'none'; $('continue').style.display = 'none'; $('pause').style.display = 'none'; delete $('result').dataset.shown;
  if (camera.parent) camera.parent.remove(camera); scene.add(camera);
  newGame(); $('title').style.display = 'flex';
}
addEventListener('keydown', e => { if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && !locked()) setPaused(!G.paused); });
// アプリが裏に回ったら一時停止して音を止める
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') setPaused(true); GameAudio.suspend(); }
  else GameAudio.resume();
});
// Android の戻るボタン：プレイ中はポーズ切替、タイトル・結果画面ではアプリを閉じる
if (plugin('App')) {
  plugin('App').addListener('backButton', () => {
    if (state === 'title' || state === 'ending') plugin('App').exitApp();
    else if (state === 'continue') giveUp();
    else setPaused(!G.paused);
  });
}
if (NATIVE) document.body.classList.add('app', 'touch');
// 表示言語（端末の言語で自動選択。タイトル画面で切り替え可能）
I18N.apply();
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => I18N.setLang(b.dataset.lang)));
// どのビルドが入っているか分かるよう、アプリ版はタイトル画面にバージョンを出す
if (window.APP_VERSION && window.APP_VERSION !== 'dev') $('buildInfo').textContent = window.APP_VERSION;
// EU など同意が必要な地域では、タイトル画面から広告の同意内容を変更できるようにする
Ads.initDone.then(() => { if (Ads.privacyOptionsRequired) $('adPrivacy').style.display = ''; });
$('adPrivacyLink').addEventListener('click', e => { e.preventDefault(); Ads.showPrivacyOptions(); });

// ------------------------------------------------------------
//  リワード広告で応急修理（傾斜 30° に達したとき、1 出撃 1 回）
// ------------------------------------------------------------
let contBusy = false, contT = 0;
function canContinue() { return !G.continued && Ads.available; }
function showContinue() {
  state = 'continue'; contT = 10; contBusy = false;
  document.body.classList.remove('playing');
  mouse.down = false; for (const k in touchHold) touchHold[k] = false;
  if (locked()) document.exitPointerLock();
  if (AU.ctx) AU.droneGain.gain.value = 0;
  $('contWatch').disabled = false; $('contWatch').textContent = t('cont.watch'); $('contNote').textContent = '';
  $('contCount').textContent = '10';
  $('continue').style.display = 'flex';
  AU.alarm();
}
function updateContinue(dt) {
  if (contBusy || Ads.showing) return;
  contT -= dt;
  $('contCount').textContent = Math.max(0, Math.ceil(contT));
  if (contT <= 0) giveUp();
}
function giveUp() {
  if (state !== 'continue') return;
  $('continue').style.display = 'none';
  state = 'play'; endGame('capsize');
}
$('contGiveUp').addEventListener('click', giveUp);
$('contWatch').addEventListener('click', async () => {
  if (state !== 'continue' || contBusy) return;
  contBusy = true;
  $('contWatch').disabled = true; $('contWatch').textContent = t('cont.loading');
  const result = await Ads.showRewarded();
  if (state !== 'continue') return;
  if (result === 'unavailable') { $('contNote').textContent = t('cont.fail'); setTimeout(giveUp, 2200); return; }
  if (result !== 'rewarded') { giveUp(); return; }
  $('continue').style.display = 'none';
  G.continued = true; G.list = G.listT = 12; G.lastHit = G.elapsed;
  state = 'play'; document.body.classList.add('playing');
  msg(t('msg.repaired'), 'good'); alertMsg(t('alert.repaired'));
});
$('viewBtn').addEventListener('click', () => { viewOnly = true; $('result').style.display = 'none'; setTimeout(() => { if (state === 'ending') $('result').style.display = 'flex'; }, 15000); });

// ============================================================
//  メインループ
// ============================================================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const frozen = (state === 'play' && G.paused) || state === 'continue';
  if (state === 'continue') updateContinue(dt);
  else if (state === 'play') { if (!G.paused) updatePlay(dt); }
  else if (state === 'ending') updateEnding(dt);
  else updateTitle(dt);
  if (!frozen) { PN.update(dt); PA.update(dt); }
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i]; b.t += dt;
    const k = Math.max(0, 1 - b.t / 1.8);
    b.g.children.forEach((m, j) => { m.material.opacity = [0.95, 0.35, 0.12][j] * k; const s = 1 + Math.sin(T * 50) * 0.08 + (1 - k) * 0.6; m.scale.set(s, 1, s); });
    if (b.t > 1.8) { scene.remove(b.g); b.g.children.forEach(m => { m.geometry.dispose(); m.material.dispose(); }); beams.splice(i, 1); }
  }
  sunLight.position.copy(ship.position).addScaledVector(SUN_DIR, 700); sunLight.target.position.copy(ship.position);
  const cp = camera.getWorldPosition(tmpV);
  const step = OCEAN_SIZE / OCEAN_SEG;
  ocean.position.set(Math.round(cp.x / step) * step, 0, Math.round(cp.z / step) * step);
  oceanUniforms.uTime.value = T;
  sky.position.copy(cp);
  for (const c of cloudLayers) {
    c.m.position.x = cp.x; c.m.position.z = cp.z;
    c.tex.offset.set(cp.x / 30000 * c.rep + T * 0.0008, -cp.z / 30000 * c.rep);
  }
  renderer.render(scene, camera);
  drawOverlay();
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  PN.mat.uniforms.uScale.value = PA.mat.uniforms.uScale.value = innerHeight * 0.85;
  resizeOverlay();
});
requestAnimationFrame(frame);
</script>
</body>
